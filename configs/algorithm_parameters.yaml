selector:
  model: RandomForestRegressor
  n_estimators: 500
  min_samples_leaf: 2
  max_depth: null
  target: C_LabelScore
  preprocessing:
    categorical: OneHotEncoder(handle_unknown='ignore')
    numeric: passthrough
