algorithms:
  NSGAII:
    population_size: 100
    maxFE: 10000
    source: PlatEMO/MATLAB-compatible runner
  SPEA2:
    population_size: 100
    maxFE: 10000
    source: PlatEMO/MATLAB-compatible runner
  MOEAD:
    population_size: 100
    maxFE: 10000
    source: PlatEMO/MATLAB-compatible runner
  GDE3:
    population_size: 100
    maxFE: 10000
    source: PlatEMO/MATLAB-compatible runner
  A_MPMO:
    population_size: 100
    maxFE: 10000
    source: A_MPMO_NSGAII_v290.m
  ECMADE_MOO:
    population_size: 100
    maxFE: 10000
    source: ECMADE_MOO.m and ecmade_moo.py
